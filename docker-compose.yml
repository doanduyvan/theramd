  #   restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    container_name: theramd-certbot
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    command: >
      sh -c "trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot;
        sleep 12h & wait $${!};
      done"
    restart: unless-stopped

volumes:
  mysql-data:
  certbot-www:
  certbot-certs:
  backend-vendor:

